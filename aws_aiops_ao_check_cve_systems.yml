---

- name: Check CVE Details
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: vars/main.yml
  tasks:
    - name: Debug Hostvars
      ansible.builtin.debug:
        var: hostvars['localhost']

    - name: AIOps Lightspeed action payload
      ansible.builtin.set_fact:
        payload: "{{ ansible_eda.event.payload }}"

    - name: Debug Events
      ansible.builtin.debug:
        var: payload

    # using an item tasks playbook prevents loop to abort when any item fails
    - name: Loop over CVEs and Launch Job Workflow Template
      ansible.builtin.include_tasks: aws_aiops_check_cve_systems_item.yml
      loop: "{{ payload.events }}"

