# Wait for boot up
- name: Wait until RHEL 1 boots up
  wait_for:
    port: 22
    state: started
    timeout: 360
    delay: 10
    host: "{{ ec2_rhel1_instance.instances[0].public_dns_name }}"

- name: Wait until RHEL 2 boots up
  wait_for:
    port: 22
    state: started
    timeout: 360
    delay: 10
    host: "{{ ec2_rhel2_instance.instances[0].public_dns_name }}"

- name: Wait until RHEL 3 boots up
  wait_for:
    port: 22
    state: started
    timeout: 360
    delay: 10
    host: "{{ ec2_rhel3_instance.instances[0].public_dns_name }}"

- name: Sleep for 30 seconds and continue with play
  wait_for:
    timeout: 30
  delegate_to: localhost

